<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eve</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      font-family: "Georgia", "Songti SC", serif;
      color: #1a1a1a;
    }
    .dot {
      width: 10px; height: 10px;
      background: #c0392b;
      border-radius: 50%;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 8px;
    }
    .line {
      width: 60px; height: 1px;
      background: #1a1a1a;
      margin: 24px 0;
    }
    p {
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="dot"></div>
  <h1>eve</h1>
  <div class="line"></div>
  <p>COMING SOON</p>
</body>
</html>
