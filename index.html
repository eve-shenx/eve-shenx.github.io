<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eve</title>
<style>
  :root{
    --paper:#faf9f6;--ink:#1a1a1a;--grey:#8a8a86;--line:#d8d6cf;
    --red:#c0392b;--yellow:#e0a92e;--green:#2e7d5b;--blue:#2c5f8a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:"Songti SC","Georgia",serif;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:none;}
  a,button,.work{cursor:none;}
  .wrap{max-width:960px;margin:0 auto;padding:0 40px;position:relative;z-index:2;}
  .bg-art{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
  .rail{position:fixed;left:38px;top:18vh;bottom:18vh;width:1px;background:var(--line);z-index:5;pointer-events:none;}
  .rail .fill{position:absolute;top:0;left:0;width:1px;height:0;background:var(--ink);transition:height .15s linear;}
  .rail .node{position:absolute;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--paper);border:1px solid var(--grey);transition:all .4s;}
  .rail .node.on{background:var(--red);border-color:var(--red);transform:scale(1.25);}
  @media(max-width:900px){.rail{display:none;}}
  .cursor{position:fixed;top:0;left:0;width:12px;height:12px;background:var(--red);border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s;mix-blend-mode:normal;}
  .cursor.big{width:44px;height:44px;background:rgba(192,57,43,.15);}
  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;background:rgba(250,249,246,.82);backdrop-filter:blur(8px);border-bottom:1px solid transparent;transition:border-color .4s;}
  nav.scrolled{border-color:var(--line);}
  nav .logo{font-size:20px;letter-spacing:4px;}
  nav .logo b{color:var(--red);}
  nav .links a{margin-left:28px;color:var(--grey);text-decoration:none;font-family:sans-serif;font-size:13px;letter-spacing:1px;transition:color .3s;}
  nav .links a:hover{color:var(--ink);}
  @media(max-width:640px){nav .links a{margin-left:16px;font-size:11px;}nav{padding:18px 20px;}}
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:2;}
  .hero .dot{width:9px;height:9px;background:var(--red);border-radius:50%;margin-bottom:38px;animation:float 4s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:clamp(64px,14vw,140px);font-weight:400;letter-spacing:.08em;line-height:1;}
  .hero .stroke{width:64px;height:1px;background:var(--ink);margin:28px auto;}
  .hero .sub{font-family:sans-serif;font-size:13px;letter-spacing:5px;color:var(--grey);text-transform:uppercase;}
  .hero .scroll-hint{position:absolute;bottom:36px;font-family:sans-serif;font-size:11px;letter-spacing:3px;color:var(--grey);}
  .hero .scroll-hint::after{content:"";display:block;width:1px;height:34px;background:var(--line);margin:12px auto 0;}
  section.block{padding:120px 0;border-top:1px solid var(--line);position:relative;z-index:2;}
  .num{font-family:"Georgia",serif;font-size:120px;color:rgba(26,26,26,.05);position:absolute;top:60px;right:40px;line-height:1;z-index:0;}
  .vtag{position:absolute;left:-2px;top:120px;writing-mode:vertical-rl;font-family:sans-serif;font-size:11px;letter-spacing:4px;color:var(--grey);text-transform:uppercase;}
  .kicker{font-family:sans-serif;font-size:12px;letter-spacing:4px;color:var(--red);text-transform:uppercase;margin-bottom:18px;}
  .block h2{font-size:34px;font-weight:400;letter-spacing:2px;margin-bottom:28px;position:relative;z-index:2;}
  .block p.lead{font-size:18px;color:#3a3a38;max-width:620px;}
  .quote{font-size:26px;line-height:1.9;letter-spacing:2px;max-width:640px;margin-top:10px;position:relative;padding-left:26px;}
  .quote::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--red);}
  .quote small{display:block;font-size:14px;color:var(--grey);letter-spacing:2px;margin-top:16px;font-family:sans-serif;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .cell{background:var(--paper);padding:44px 38px;transition:background .35s;position:relative;}
  .cell:hover{background:#fff;}
  .cell .ic{margin-bottom:18px;}
  .cell .ic path,.cell .ic line,.cell .ic rect{stroke-dasharray:200;stroke-dashoffset:0;transition:stroke-dashoffset .8s ease;}
  .cell:hover .ic path,.cell:hover .ic line,.cell:hover .ic rect{stroke-dashoffset:200;animation:redraw .9s ease forwards;}
  @keyframes redraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
  .cell .en{font-family:sans-serif;font-size:11px;letter-spacing:3px;color:var(--grey);text-transform:uppercase;}
  .cell h3{font-size:21px;font-weight:400;letter-spacing:3px;margin:4px 0 12px;}
  .cell p{font-size:16px;color:#4a4a46;letter-spacing:1px;line-height:1.7;}
  .works{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:12px;}
  @media(max-width:640px){.works{grid-template-columns:1fr;}}
  .work{border:1px solid var(--line);padding:38px 32px;text-decoration:none;color:var(--ink);display:block;transition:transform .35s,border-color .35s;position:relative;overflow:hidden;}
  .work:hover{transform:translateY(-4px);border-color:var(--ink);}
  .work .tag{font-family:sans-serif;font-size:11px;letter-spacing:2px;color:var(--grey);}
  .work h3{font-size:23px;font-weight:400;letter-spacing:1px;margin:14px 0 10px;}
  .work p{font-family:sans-serif;font-size:14px;color:#57574f;line-height:1.7;}
  .work .status{display:inline-block;margin-top:20px;font-family:sans-serif;font-size:12px;letter-spacing:2px;color:var(--red);}
  .work .corner{position:absolute;top:18px;right:20px;width:7px;height:7px;border-radius:50%;}
  footer{border-top:1px solid var(--line);padding:60px 0 80px;text-align:center;position:relative;z-index:2;}
  footer .dot{width:7px;height:7px;background:var(--red);border-radius:50%;margin:0 auto 24px;}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-family:sans-serif;font-size:14px;letter-spacing:1px;padding-bottom:2px;transition:border-color .3s;}
  footer a:hover{border-color:var(--ink);}
  footer p{font-family:sans-serif;font-size:12px;color:var(--grey);letter-spacing:2px;margin-top:24px;}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s;}
  .reveal.show{opacity:1;transform:none;}
  @media(max-width:640px){body{cursor:auto;}.cursor{display:none;}.num{font-size:70px;right:20px;}.vtag{display:none;}}
</style>
</head>
